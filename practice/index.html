  $("stitle").textContent = d.title || d.kr;
  $("skr").textContent = d.kr;
  $("slines").innerHTML = d.lines.map(l => `<div>${l}</div>`).join("");
  $("mt").textContent = d.t || "—";
  $("md").textContent = fmt(d.dur);
  $("tg").textContent = fmt(d.dur);
  let h = d.acts.map(a => `<div class="act">🎬 ${a}</div>`).join("");
  h += d.paras.map(p => `<p class="para">${p}</p>`).join("");
  if (d.bridge) h += `<div class="bridge"><div class="blab">다음 장 넘기며</div>
    <div class="btxt">“${d.bridge}”</div></div>`;
  $("scriptscroll").innerHTML = h;
  $("scriptscroll").scrollTop = 0;
  $("fill").style.width = (100 * (cur + 1) / D.length) + "%";
  document.getElementById("scriptpane").classList.toggle("blur", mode === "recall");
  slideT0 = perf();
  try { localStorage.setItem("ba_cur", String(cur)); } catch {}
  updatePace();
}
function go(i) { cur = Math.max(0, Math.min(D.length - 1, i)); render(); }

/* ---- timer & pace ---- */
let running = false, elapsed = 0, tick = null, slideT0 = 0;
const perf = () => Date.now() / 1000;
let lastStart = 0;
function updatePace() {
  const idealPrev = D.slice(0, cur).reduce((a, d) => a + d.dur, 0);
  const diff = Math.round(elapsed - idealPrev);
  const p = $("pace");
  if (!running && elapsed === 0) { p.textContent = "—"; p.className = ""; return; }
  p.textContent = (diff >= 0 ? "+" : "−") + fmt(Math.abs(diff));
  p.className = diff > 20 ? "behind" : (diff < -20 ? "ahead" : "");
}
function loop() {
  if (running) elapsed += 0.5;
  $("clock").textContent = fmt(elapsed);
  $("el").textContent = fmt(Math.max(0, elapsed - D.slice(0, cur).reduce((a,d)=>a+d.dur,0) < 0 ? 0 : (perf() - slideT0)));
  updatePace();
}
$("tbtn").onclick = () => {
  running = !running;
  $("tbtn").textContent = running ? "⏸" : "▶";
  if (running && !tick) { slideT0 = perf(); tick = setInterval(loop, 500); }
};
$("tbtn").oncontextmenu = e => { e.preventDefault(); running = false; elapsed = 0;
  $("tbtn").textContent = "▶"; $("clock").textContent = "0:00"; updatePace(); };

/* ---- nav ---- */
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("edgeL").onclick = () => go(cur - 1);
$("edgeR").onclick = () => go(cur + 1);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
});
let tx = null;
addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive: true});
addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1));
}, {passive: true});

/* ---- recall blur toggle ---- */
$("scriptpane").onclick = () => {
  if (mode === "recall") $("scriptpane").classList.toggle("blur");
};

/* ---- modes ---- */
document.querySelectorAll("#modes .mbtn").forEach(b => b.onclick = () => {
  document.querySelectorAll("#modes .mbtn").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  mode = b.dataset.m;
  if (mode === "bridge") { openCards(); return; }
  $("cardmode").classList.remove("on");
  $("scriptpane").classList.toggle("blur", mode === "recall");
});

/* ---- bridge cards ---- */
const B = D.filter(d => d.bridge).map(d => ({n: d.n, title: d.title || d.kr, txt: d.bridge}));
let order = B.map((_, i) => i), ci = 0;
function showCard() {
  const c = B[order[ci]];
  $("bcard").classList.remove("show");
  $("bfront").innerHTML = `<small>슬라이드 ${c.n} → ${c.n + 1}</small>${c.title}`;
  $("bback").textContent = "“" + c.txt + "”";
}
function openCards() { $("cardmode").classList.add("on"); ci = 0; showCard(); }
$("bcard").onclick = () => $("bcard").classList.add("show");
$("cnext").onclick = () => { ci = (ci + 1) % order.length; showCard(); };
$("cprev").onclick = () => { ci = (ci - 1 + order.length) % order.length; showCard(); };
$("cshuf").onclick = () => { order.sort(() => Math.random() - 0.5); ci = 0; showCard(); };
$("cexit").onclick = () => {
  $("cardmode").classList.remove("on");
  document.querySelectorAll("#modes .mbtn").forEach(x =>
    x.classList.toggle("on", x.dataset.m === "read"));
  mode = "read"; render();
};

/* ---- script size & focus mode ---- */
let fs = 19, focus = false;
try { fs = parseInt(localStorage.getItem("ba_fs") || "19");
      focus = localStorage.getItem("ba_focus") === "1"; } catch {}
function applyView() {
  document.documentElement.style.setProperty("--fs", fs + "px");
  document.body.classList.toggle("focus", focus);
  $("focusbtn").classList.toggle("on", focus);
  try { localStorage.setItem("ba_fs", String(fs));
        localStorage.setItem("ba_focus", focus ? "1" : "0"); } catch {}
}
$("fminus").onclick = () => { fs = Math.max(15, fs - 1); applyView(); };
$("fplus").onclick = () => { fs = Math.min(26, fs + 1); applyView(); };
$("focusbtn").onclick = () => { focus = !focus; applyView(); };
const _render = render;
render = function () { _render();
  $("focustitle").textContent = `${D[cur].title || D[cur].kr}`; };
applyView();
render();
</script>
