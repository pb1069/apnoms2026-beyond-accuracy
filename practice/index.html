<title>Beyond Accuracy Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root { --bg:#0F1420; --card:#1A2233; --line:#232E47; --ink:#E8EDF6; --dim:#8FA0BB;
          --accent:#5B9DFF; --warn:#FFB454; --ok:#3ECF8E; --bad:#FF6B6B; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); overflow:hidden;
         font:15px/1.55 Archivo, "Segoe UI", system-ui, sans-serif; }
  #app { height:100%; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  #top { display:flex; align-items:center; gap:10px; padding:8px 14px;
         border-bottom:1px solid var(--line); flex:0 0 auto; }
  #pos { font-weight:700; font-size:15px; letter-spacing:.3px; white-space:nowrap; }
  #pos span { color:var(--dim); font-weight:500; }
  #modes { display:flex; gap:6px; margin-left:auto; }
  .mbtn { background:none; border:1px solid var(--line); color:var(--dim); border-radius:999px;
          padding:4px 12px; font:600 12.5px Archivo, sans-serif; cursor:pointer; }
  .mbtn.on { background:var(--accent); border-color:var(--accent); color:#08101F; }
  #timerbox { display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
  #clock { font-weight:700; font-size:15px; }
  #pace { font-size:12.5px; font-weight:700; border-radius:999px; padding:3px 10px;
          background:var(--card); color:var(--dim); }
  #pace.ahead { color:var(--ok); } #pace.behind { color:var(--bad); }
  #tbtn { background:var(--card); border:1px solid var(--line); color:var(--ink);
          border-radius:8px; padding:4px 12px; font:600 12.5px Archivo; cursor:pointer; }

  /* ---------- main split ---------- */
  #main { flex:1; display:flex; min-height:0; }
  #slidepane { flex:0 0 42%; border-right:1px solid var(--line); padding:16px 18px;
               display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  .kicker { font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--dim);
            border-left:3px solid var(--accent); padding-left:9px; }
  #stitle { font-size:22px; font-weight:700; letter-spacing:-.3px; line-height:1.25;
            text-wrap:balance; }
  #skr { color:var(--accent); font-size:12.5px; font-weight:600; }
  #slines { display:flex; flex-direction:column; gap:6px; }
  #slines div { background:var(--card); border:1px solid var(--line); border-radius:8px;
                padding:7px 10px; font-size:12.5px; color:var(--dim); line-height:1.45; }
  #meta { margin-top:auto; display:flex; gap:8px; align-items:center; padding-top:8px; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:999px;
          padding:3px 11px; font-size:12px; font-weight:600; color:var(--dim);
          font-variant-numeric:tabular-nums; }
  .chip b { color:var(--ink); }

  #scriptpane { flex:1; position:relative; min-width:0; }
  #scriptscroll { height:100%; overflow-y:auto; padding:18px 22px 90px; }
  .act { background:none; border:0; border-left:3px solid var(--line);
         padding:2px 12px; margin:0 0 12px; font-size:12px;
         color:var(--dim); opacity:.85; }
  :root { --fs:19px; }
  .para { font:400 var(--fs)/1.8 "Source Serif 4", Georgia, serif; margin:0 0 18px;
          max-width:34em; color:#F2F5FB; }
  .para b { font-weight:600; }
  .cue { color:var(--dim); font-style:italic; font-size:.85em; }
  .bridge { border:1px solid var(--warn); border-radius:10px; padding:12px 16px;
            margin-top:6px; max-width:34em; }
  .bridge .blab { font-size:10.5px; letter-spacing:2px; color:var(--warn);
                  text-transform:uppercase; font-weight:700; margin-bottom:4px; }
  .bridge .btxt { font:600 calc(var(--fs) - 1px)/1.55 "Source Serif 4", Georgia, serif; color:var(--warn); }

  /* recall (blur) mode */
  #scriptpane.blur #scriptscroll { filter:blur(7px); }
  #veil { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
          font:600 14px Archivo; color:var(--dim); letter-spacing:1px; }
  #scriptpane.blur #veil { display:flex; }

  /* focus mode: collapse slide pane, script full-bleed */
  body.focus #slidepane { display:none; }
  body.focus #scriptscroll { padding-left:6vw; padding-right:6vw; }
  body.focus .para, body.focus .bridge { max-width:40em; }
  #focustitle { display:none; color:var(--dim); font-size:12.5px; white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; max-width:28vw; }
  body.focus #focustitle { display:block; }
  /* nav edges */
  .edge { position:fixed; top:52px; bottom:64px; width:14%; z-index:4; opacity:0; }
  #edgeL { left:0; } #edgeR { right:0; }

  /* ---------- bottom bar ---------- */
  #bottom { flex:0 0 auto; border-top:1px solid var(--line); padding:8px 14px 10px;
            display:flex; align-items:center; gap:12px; }
  .nav { background:var(--card); border:1px solid var(--line); color:var(--ink);
         border-radius:10px; width:52px; height:36px; font-size:18px; cursor:pointer; }
  #bar { flex:1; height:5px; background:var(--card); border-radius:3px; overflow:hidden; }
  #fill { height:100%; width:0; background:var(--accent); border-radius:3px; }
  #target { font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums;
            white-space:nowrap; }

  /* ---------- bridge-card mode ---------- */
  #cardmode { position:fixed; inset:0; background:var(--bg); display:none;
              flex-direction:column; align-items:center; justify-content:center;
              gap:22px; padding:24px; z-index:9; }
  #cardmode.on { display:flex; }
  #bcard { background:var(--card); border:1px solid var(--line); border-radius:16px;
           width:min(560px, 92vw); min-height:240px; padding:26px 30px; display:flex;
           flex-direction:column; gap:14px; justify-content:center; cursor:pointer; }
  #bfront { font:600 19px/1.4 Archivo; letter-spacing:-.2px; }
  #bfront small { display:block; color:var(--dim); font-size:12px; letter-spacing:2px;
                  text-transform:uppercase; margin-bottom:8px; }
  #bback { font:600 17px/1.55 "Source Serif 4", Georgia, serif; color:var(--warn);
           display:none; }
  #bcard.show #bback { display:block; }
  #bhint { color:var(--dim); font-size:12.5px; }
  #cardnav { display:flex; gap:12px; align-items:center; }
  #cardnav .mbtn { font-size:14px; padding:8px 18px; }

  /* ---------- portrait ---------- */
  @media (orientation: portrait) {
    #main { flex-direction:column; }
    #slidepane { flex:0 0 auto; border-right:0; border-bottom:1px solid var(--line);
                 max-height:34vh; }
    #meta { margin-top:0; }
    #rotate { display:block; }
  }
  #rotate { display:none; text-align:center; color:var(--dim); font-size:11.5px;
            padding:2px 0 0; }
</style>

<script>
const D = [{"n": 1, "kr": "Title", "t": "09:00", "dur": 60, "acts": ["마이크 체크 후 정면. 서버·터미널·대시보드 사전 기동 확인 완료 상태."], "paras": ["Good morning, everyone, and welcome to the first tutorial of APNOMS 2026. My name is Ui-Jun Baek. I am a senior researcher at KISTI — the Korea Institute of Science and Technology Information — where I work on AI-based network intrusion detection, and, more and more, on a question that sits underneath all of it: when an AI system hands us an answer, how do we decide whether to believe it?", "That question sounds philosophical. I promise you it is not. Over the next eighty minutes it will be extremely concrete — concrete enough that we will measure it, live, in this room, on models running on this laptop. Everything you see today is packaged so you can rerun every number yourself tonight."], "bridge": "And I want to begin with a single number.", "tag": "APNOMS 2026 · Tutorial 1 · Sep 9, 09:00–10:20 · Civic Hall A", "title": "", "lines": ["Beyond Accuracy", "Assessing the Reliability of AI Outputs in Security Operations", "Ui-Jun Baek, Ph.D. · Senior Researcher", "Science and Technology Security Research Center, KISTI"]}, {"n": 2, "kr": "Hook", "t": "09:01", "dur": 120, "acts": ["표를 가리키고 2초 침묵 후 시작. 마지막 질문 후 3초 침묵."], "paras": ["<em class=\"cue\">(2초 침묵)</em> This is a network intrusion detector. A neural network, trained the way most of us train them, evaluated on test traffic that contains some evasive samples. On this traffic it is about sixty-nine percent accurate — not great, not disastrous, the kind of number you might see the week something changes on your network.", "Now look at its confidence. On the answers it got right, the average confidence is zero point nine four five seven. On the answers it got wrong — zero point nine six three five. <em class=\"cue\">(pause)</em> Read that again. This model is more confident when it is wrong. Its most confident answers are its mistakes. And this is not a broken model, or a toy I sabotaged for the demo — it is a heavily regularized, honestly trained classifier doing exactly what the training objective told it to do.", "So here is my question for you, and I want you to actually answer it in your head. Your SOC runs this model. It flags a flow as an attack, confidence ninety-six percent. Would you let it auto-block? <em class=\"cue\">(pause — 청중 훑기)</em>", "Keep that number in mind — zero nine six three five. In about thirty minutes, we will reproduce it live, in this room. Not from my slides — from the code, verified against a pinned reference. If it comes out different by even half a percent, you will see the verification fail on screen."], "bridge": "So — here is the plan for our eighty minutes.", "tag": "Hook", "title": "This model is more confident when it is wrong", "lines": ["Prediction group Mean confidence", "Correct predictions 0.9457", "Wrong predictions 0.9635 ▲", "A network intrusion detector, 69% accurate against evasive traffic —"]}, {"n": 3, "kr": "Roadmap", "t": "09:03", "dur": 90, "acts": [], "paras": ["Three parts. First, concepts — why accuracy-centered evaluation, the way we all do it in papers, quietly falls apart in operations. Second, live demos, in two labs: a small synthetic lab where I control the failure mechanism completely and can therefore explain every number, and then CIC-IDS2017 — the dataset that everyone in this room has probably trained something on at least once. Third, operational guidance: a decision gate you can take home and apply on Monday.", "Everything is runnable three ways, and every &quot;Run it&quot; page in this deck shows all three side by side. Path A: paste our prompts into an LLM agent — Claude Code, Codex, whatever you use. Path B: manual commands, Docker or plain Python. Path C: one-click buttons that live inside these very slides. Same task, same verified numbers, pick whichever you trust — and by the end of today, &quot;pick whichever you trust&quot; will itself be a loaded phrase.", "One more thing about how we work: we pipeline. I will kick off each experiment before I explain the concept it proves. So by the time you understand why a result matters, the result is already sitting there waiting for us."], "bridge": "And ‘pipeline’ starts meaning something right now.", "tag": "Roadmap", "title": "How this tutorial runs", "lines": ["Concepts — why accuracy-centered evaluation fails in operations", "Live demos in two labs — a controlled synthetic lab (mechanism),", "then CIC-IDS2017 (reality)", "Operational guidance — accept / review / withhold"]}, {"n": 4, "kr": "Kickoff ①", "t": "09:04", "dur": 30, "acts": ["배지 가리키기, 빠르게."], "paras": ["An agent is about to build and verify our entire lab — the environment, the data, the models, the dashboard — while we talk about why any of this matters."], "bridge": "Next page.", "tag": "Kickoff ① · 09:03", "title": "Setup — an agent builds the lab while we talk", "lines": ["AGENT KICKOFF", "An agent is about to build and verify the whole lab — while we talk.", "Next page: run setup your way — manual, one-click, or agent prompt.", "Repo: github.com/pb1069/apnoms2026-beyond-accuracy · prompts/00_setup.md"]}, {"n": 5, "kr": "Run it — Setup", "t": "09:05", "dur": 120, "acts": ["Shift+T → 터미널 오버레이 확대 → 프롬프트 copy → 붙여넣기 → 엔터 → 잠시 보여주고 → t로 축소(구석 유지)."], "paras": ["This is a &quot;Run it&quot; page — you will see five of them today, and they all have the same shape. Left side, top to bottom: the manual command, the one-click button, and the agent prompt. Right side: the live output of whatever you chose. Three roads, one destination, and the destination is always a verified number, never a vibe.", "Today I will mostly use the agent, because I want you to watch that workflow with your own eyes. <em class=\"cue\">(프롬프트 붙여넣기)</em> I am pasting the setup prompt into Claude Code. Notice what the prompt actually says — it does not say &quot;set things up.&quot; It says: build it, then verify the shipped artifacts against pinned checksums, and report what passed. The verification is in the prompt. That choice is going to become a theme. <em class=\"cue\">(엔터, t로 축소)</em>", "And that&#x27;s it — the agent is working in the corner of the screen. While it builds our lab, let me tell you why we are all here."], "bridge": "Let’s start with the good news.", "tag": "Run it · Setup", "title": "Three ways to run it — setup & verify", "lines": ["Manual", "docker compose build", "docker compose run --rm lab python scripts/smoke_test.py copy", "One-click · presenter"]}, {"n": 6, "kr": "Part 1: 성과", "t": "09:07", "dur": 150, "acts": [], "paras": ["The good news is real: detection accuracy is, frankly, a solved-looking problem. On the public benchmarks, binary detection — benign versus attack — has been sitting at ninety-nine percent plus for years. Multi-class attack classification runs from the high seventies into the nineties depending on the dataset and the split. Deep models, gradient boosting, even careful classical pipelines — they all get there. If accuracy were the finish line, this tutorial would be a victory lap.", "But think about what an alert actually is in production. Every alert triggers work: an analyst opens it, pulls context, correlates, maybe escalates, maybe blocks real traffic that real users are depending on. The question in operations is therefore no longer &quot;can the model detect?&quot; It is: &quot;can the analyst act on this output?&quot; — act, with confidence, at three in the morning, without a data scientist on call.", "And the asymmetry is brutal. A missed attack is bad, but a wrong-but-confident output that someone acted on — a blocked service, a closed ticket that should have stayed open — costs more, because it spends the one resource you cannot buy back: the team&#x27;s trust in the system. Once analysts learn to ignore the model, you do not have an AI-assisted SOC anymore. You have an expensive log generator."], "bridge": "So let’s name the traps — there are three.", "tag": "Part 1 · The traps", "title": "Detection accuracy is a solved-looking problem", "lines": ["Task (public IDS benchmarks) Typical accuracy", "Binary detection (benign vs attack) 0.99+", "Multi-class attack classification 0.77 – 0.97", "The question in operations is no longer"]}, {"n": 7, "kr": "Trap 1: Overconfidence", "t": "09:09", "dur": 150, "acts": [], "paras": ["Trap number one: overconfidence. The softmax probability your model outputs is not the probability of being correct. It never was. It is a trained artifact — the by-product of an optimization that was asked to separate classes, not to report honest odds.", "Here is the mechanism, and it is worth thirty seconds because it explains half of today. When your training data is cleanly separable — and benchmark data usually is — cross-entropy keeps rewarding the model for pushing outputs toward zero and one, long after the decision boundary has stopped moving. The geometry is settled; the probabilities keep inflating. So you graduate a model whose every answer sounds like a ninety-nine.", "And here is the dangerous part: calibration breaks silently. There is no exception, no error message, no red light. A model can be ninety-nine percent &quot;confident&quot; on an input unlike anything it was trained on, because confidence measures one thing only — distance from a learned boundary. If the input is far from the boundary, the model is confident. Whether the boundary means anything out there is a question the softmax cannot even express. Confidence measures geometry. It does not measure truth."], "bridge": "That was the first trap. The second one is sneakier.", "tag": "Part 1 · Trap 1/3", "title": "Overconfidence — wrong ≠ uncertain", "lines": ["Softmax probability is not P(correct) — it is a trained artifact", "Cleanly separable training data ⇒ cross-entropy drives outputs to 0.99+", "Calibration breaks silently : no error message, no exception", "A model can be 99% \"confident\" on inputs unlike anything it was trained on."]}, {"n": 8, "kr": "Trap 2: Shortcut learning", "t": "09:12", "dur": 150, "acts": [], "paras": ["Trap number two: shortcut learning. Models are lazy in a very specific way — they latch onto the easiest separating feature, not the true cause. If some superficial signal happens to correlate with the label in your dataset, the model will ride it, because the optimizer has no concept of &quot;superficial.&quot; It only has gradients.", "In traffic data the shortcuts are everywhere. A TLS fingerprint that happens to identify the attack tool used in the capture. A port pattern. A time-of-day artifact from how the dataset was collected — the famous cases in our field are exactly this. The shortcut holds perfectly inside the dataset, your test accuracy looks wonderful, reviewers are happy. And then it inverts in the wild: an attacker updates their library, or a benign application adopts the same fingerprint, and the feature that carried your accuracy now carries your errors — at full confidence, because the model never knew it was leaning on a crutch.", "In our synthetic lab, we did something slightly unusual: we planted the shortcut on purpose. One feature, almost perfectly correlated with the label in training, inverted and exaggerated in part of the test set. So today you will see exactly what happens when reality breaks a shortcut — and because we planted it, we can explain every single number instead of waving our hands."], "bridge": "And the third trap ties the first two together.", "tag": "Part 1 · Trap 2/3", "title": "Shortcut learning — the fingerprint trap", "lines": ["Models latch onto the easiest separating feature , not the true cause", "In traffic data: TLS fingerprints, port patterns, capture-time artifacts", "The shortcut holds in the dataset — and inverts in the wild (evasion, benign look-alikes)", "Our lab dataset has a shortcut planted by design —"]}, {"n": 9, "kr": "Trap 3: Distribution shift", "t": "09:14", "dur": 150, "acts": [], "paras": ["Trap number three: distribution shift — and its evil twin, the label problem. Traffic drifts, constantly. New applications, new TLS libraries, new CDN behavior, new attack tooling. Your model is a photograph of the network on the day you trained it, and the network does not stand still for photographs.", "Every ML course tells you the answer: monitor your accuracy in production. And here is the joke — you cannot. Accuracy needs labels, and nobody labels live traffic. Ground truth arrives late, if it arrives at all: an incident report next week, a threat-intel match next month. Think about what that means structurally: the one metric you optimized, the one metric on your slides and in your paper, is the one metric you cannot watch in the only environment that matters.", "So here is the requirement that drives everything else today, and I will say it slowly. <em class=\"cue\">(강조, 천천히)</em> Accuracy is not reliability. Operations need signals that are computable without labels — and that fail loudly when the model fails. Signals that scream. The rest of this tutorial is a hunt for signals like that: we will meet candidates, test them in a controlled lab, and then watch which of them survive contact with real data."], "bridge": "Before we go deeper — let’s check on our agent.", "tag": "Part 1 · Trap 3/3", "title": "Distribution shift — and the label problem", "lines": ["Traffic drifts: new apps, new libraries, new attack tooling", "Accuracy in production is invisible — nobody labels live traffic", "So the one metric you optimized is the one metric you cannot watch", "Accuracy ≠ Reliability."]}, {"n": 10, "kr": "Checkpoint ①", "t": "09:16", "dur": 90, "acts": ["표가 자동으로 채워져 있는지 확인. 미완이면: &quot;The agent is still finishing — we&#x27;ll check back in one slide.&quot;"], "paras": ["<em class=\"cue\">(표 가리키며)</em> The lab is up. Look at what the agent reported: Python three-thirteen, the exact pinned library versions down to the patch number, setup in under a minute — and the line that matters most: the dataset content hash matches the pinned reference. Not the file name. Not the file size. The content.", "I want to dwell on that for ten seconds, because it is the quiet foundation under everything today. The environment is pinned, the data is pinned by hash, every random seed is pinned, and the expected outputs are pinned with a tolerance of half a percent of nothing. Which means the numbers you are about to see in this room are, provably, the numbers you will get at home. In a talk about not trusting AI outputs, the least I can do is make my own outputs verifiable."], "bridge": "So what exactly did the agent just build? Meet Lab one.", "tag": "Checkpoint ① · 09:15", "title": "Is the lab ready?", "lines": ["LIVE", "Setup report Value", "Python (container) —", "numpy / scikit-learn — / —"]}, {"n": 11, "kr": "Lab 1: 데이터셋", "t": "09:17", "dur": 150, "acts": [], "paras": ["Lab one is small on purpose: six thousand training flows, four thousand test flows, thirty features arranged in three modality groups — think behavioral, statistical, and session-level, like real traffic features.", "Six of the thirty features are true attack indicators. They behave the way real evidence behaves: benign traffic sits near zero, attacks shift upward, with noise and overlap. This is the honest signal — no single indicator is conclusive, but together they carry the truth.", "One feature is our planted shortcut: in the training data it is almost perfectly correlated with the label. If you were the optimizer, you would love this feature. It is clean, it is strong, and it is a lie waiting to happen.", "Because here is the test set: seventy percent of it is ordinary. But thirty percent is evasive — and evasive samples do two things at once, exactly like a capable adversary. They suppress the true indicators: the real evidence goes quiet. And they invert and exaggerate the shortcut: the superficial pattern points the wrong way, loudly. Hide the real signal, spoof the fake one. That combination — quiet truth, loud lie — is precisely the input that turns an overconfident model into a confident liar.", "Synthetic on purpose: we control the failure mechanism, so every number that follows can be explained, not just observed."], "bridge": "That’s the data. Now the two detectors we’ll pit against each other.", "tag": "Lab 1 · synthetic · 1/2", "title": "Meet the dataset (you take it home)", "lines": ["Ingredient Design", "Traffic flows 6,000 train / 4,000 test · 30 features · 3 modality groups", "True evidence 6 attack-indicator channels (benign ≈ 0, attacks shift up)", "Planted shortcut 1 feature, near-perfectly correlated with the label — in training"]}, {"n": 12, "kr": "Lab 1: 모델", "t": "09:20", "dur": 120, "acts": [], "paras": ["Two detectors, one dataset. In the left corner: the baseline — a single MLP that sees all thirty features. And I want to stress this: it is a good model. Heavily regularized, so its confidence genuinely tracks signal strength instead of saturating at one point zero on everything. I built the strongest reasonable single model I could, because beating a strawman would teach us nothing.", "In the right corner: an ensemble of forty small experts. Each expert sees only twelve of the thirty features — a different twelve. And there is one deliberate constraint that does a lot of work: only ten of the forty experts are allowed to see the shortcut feature at all. Thirty of them are structurally incapable of learning the lie. That is diversity as a design principle: not forty opinions about the same evidence, but forty different bodies of evidence.", "Every seed, every split, every hyperparameter is pinned in one config file that the tooling refuses to edit. And we verified something I find genuinely satisfying: train this on Docker on Linux, or natively on Windows, and the results agree to four decimal places. Determinism is not glamorous, but it is what makes the word &quot;reproduce&quot; mean something."], "bridge": "Lab ready. Four concepts to arm ourselves with — starting with the one everyone assumes they understand.", "tag": "Lab 1 · synthetic · 2/2", "title": "Two detectors, one dataset", "lines": ["Baseline One MLP, sees all 30 features.", "Heavily regularized, so its confidence genuinely tracks signal strength —", "a best-case single model.", "Ensemble 40 small experts, 12 features each."]}, {"n": 13, "kr": "Concept 1: Calibration", "t": "09:22", "dur": 120, "acts": [], "paras": ["Concept one: confidence and calibration. The definition first, because people blur it: a model is calibrated when, among all the predictions it made with confidence zero point nine, about ninety percent are actually correct. Confidence, in a calibrated model, is a promise about frequency.", "We measure it with expected calibration error and reliability diagrams — but notice the fine print: on labeled data. Calibration is something you can only check where ground truth exists, which, as we just established, is not production.", "And the consistent empirical finding, replicated across architectures for years now, is that deep networks are systematically miscalibrated toward overconfidence. Bigger models, better accuracy, worse honesty — that trade has been documented over and over.", "One more subtlety that people miss: even a perfectly calibrated model only tells you the average risk. &quot;Ninety percent of my ninety-percent answers are right&quot; is a statement about the herd. It cannot tell you which specific prediction is the one in ten that is wrong — and in a SOC, the specific one is the entire job."], "bridge": "Let me show you what miscalibration looks like as a picture.", "tag": "Part 2 · Concept 1/4", "title": "Confidence & calibration", "lines": ["Calibrated : among outputs with confidence 0.9, ~90% are correct", "Measured by ECE / reliability diagrams — on labeled data", "Deep nets are systematically miscalibrated toward overconfidence", "Even a perfectly calibrated model only tells you the average risk —"]}, {"n": 14, "kr": "Reliability diagram", "t": "09:24", "dur": 90, "acts": ["SVG의 빨간 곡선 가리키기."], "paras": ["One picture. The dashed diagonal is a calibrated model — stated confidence equals actual accuracy, all the way up. The red curve is a typical deep network: everywhere below the diagonal, promising more than it delivers.", "Two properties of that gap make it operationally nasty. First, it is invisible at run time — drawing this picture requires labels, so in production the red curve is a ghost. You cannot see it; you can only suffer it. Second, look where the gap is widest: the right-hand side. The high-confidence zone. The exact region where your automation rules live, where &quot;confidence above zero point nine five, auto-close&quot; sounded like a sensible policy. The model is at its most dishonest precisely where you trust it most. Demo one is going to put live numbers on this curve."], "bridge": "Now — the obvious question: can’t we just fix calibration?", "tag": "Part 2 · Concept 1/4", "title": "What miscalibration looks like", "lines": ["[도해]", "The red gap is invisible at run time", "It is widest exactly where you trust most: the high-confidence zone", "Demo 1 puts real numbers on this curve"]}, {"n": 15, "kr": "Fixing calibration", "t": "09:25", "dur": 120, "acts": [], "paras": ["And the answer is: mostly, yes — and you should. This is the good-news slide. Temperature scaling is the workhorse: one scalar, fitted on a validation set in thirty seconds, divides your logits and drags that red curve most of the way back to the diagonal. One parameter. If your production model has never been temperature-scaled, that is a free improvement you can ship this week. Platt scaling does the same job with a logistic fit; isotonic regression handles uglier score distributions if you have the validation data to feed it; label smoothing and focal-style losses bake softer probabilities in at training time.", "None of this is exotic. It is hygiene — like washing your hands. Cheap, effective, no excuse to skip it.", "But notice what calibration actually gives you: a better-behaved model. The probabilities become honest on average, under the distribution you calibrated on. It is still not a verified model. A calibrated ninety-five percent is a well-mannered opinion — it is not evidence, and it names no specific error. Hold that thought."], "bridge": "Because there’s a catch — and the catch is time.", "tag": "Part 2 · Concept 1/4", "title": "Can we fix calibration? — mostly, yes", "lines": ["Method How Cost", "Temperature scaling one scalar T on the logits, fit on validation trivial — do this by default", "Platt scaling logistic fit on scores trivial", "Isotonic regression monotone re-mapping needs more validation data"]}, {"n": 16, "kr": "Calibration is a snapshot", "t": "09:27", "dur": 120, "acts": [], "paras": ["Here is the catch: calibration is a snapshot. You fitted that temperature on yesterday&#x27;s validation set, drawn from yesterday&#x27;s traffic. The guarantee is conditional on the world continuing to look like yesterday.", "And under distribution shift, the empirical pattern is consistent and cruel: calibration degrades first and fastest — typically before accuracy visibly moves. The model starts inflating again on the new inputs while still looking fine on your dashboards. So the well-mannered probabilities you shipped quietly turn back into salesmanship, and the timestamp on your calibration certificate is the only thing that changed.", "Can you recalibrate? Sure — with fresh labels. Which production does not give you. You see the loop closing: every label-hungry remedy runs into the same wall.", "So the operational posture is: calibrate, absolutely — then monitor, and never let the word &quot;calibrated&quot; become the reason an alert skips review. Calibration is hygiene, not armor. For armor, we need signals that do not depend on the model&#x27;s own self-report at all."], "bridge": "Which brings us to the direct question.", "tag": "Part 2 · Concept 1/4", "title": "The catch: calibration is a snapshot", "lines": ["You calibrate on yesterday's validation set — under yesterday's distribution", "Under shift, calibration degrades first and fastest — often before accuracy", "Recalibrating needs labels — which production does not give you", "So calibration is hygiene, not armor: do it, monitor it,"]}, {"n": 17, "kr": "Kickoff ②", "t": "09:29", "dur": 60, "acts": [], "paras": ["Is confidence an error signal at all? Not &quot;is it perfectly calibrated&quot; — lower bar: when the model is wrong, is its confidence at least lower on average? Because that is the minimum property every confidence-thresholding policy silently assumes.", "Here is the hypothesis for Demo one, and it is deliberately uncomfortable: on traffic with evasive samples, the mean confidence of the wrong predictions will be at least as high as the mean confidence of the correct ones. The error signal will point backwards. If that sounds impossible for an honestly trained model, good — that is exactly why we run it."], "bridge": "Next page — let’s start it.", "tag": "Part 2 · Concept 1/4 → Kickoff ②", "title": "So… is confidence an error signal at all?", "lines": ["Hypothesis for Demo 1: on traffic with evasive samples,", "mean confidence of wrong predictions ≥ mean confidence of correct ones.", "AGENT KICKOFF", "Kickoff: hand it to the agent — or run it yourself."]}, {"n": 18, "kr": "Run it — Demo 1", "t": "09:30", "dur": 60, "acts": ["원클릭 버튼 클릭 (Path C 시연). 오른쪽 출력 잠깐 보여주기."], "paras": ["Three ways again — this time, let me just press the button, so you see Path C too. <em class=\"cue\">(클릭)</em> One click. The baseline and all forty experts are being evaluated on the four-thousand-flow test set right now, and — watch the output — the script finishes by checking its own numbers against the pinned reference, plus or minus zero point zero zero five, and prints a pass or fail per metric. About fifteen seconds of compute.", "While it runs — two more ideas we need, and then we cash everything in."], "bridge": "Idea one: what kind of ‘don’t know’ are we even talking about?", "tag": "Run it · Demo 1", "title": "Three ways to run it — pick yours", "lines": ["Manual · Docker", "docker compose run --rm lab python experiments/demo1_confidence.py copy", "One-click · presenter", "▶ Run Demo 1"]}, {"n": 19, "kr": "Uncertainty kinds", "t": "09:31", "dur": 120, "acts": [], "paras": ["When a model should say &quot;I don&#x27;t know,&quot; there are two different species of not-knowing, and they need different treatment.", "Aleatoric uncertainty is noise in the world itself. Two flows with literally identical features, one benign, one malicious — it happens; encrypted traffic is lossy evidence. No model, however clever, resolves that. It is irreducible; the honest response is a probability, and calibration is how you keep that probability honest.", "Epistemic uncertainty is the model&#x27;s own ignorance: inputs unlike anything it trained on. This one is reducible — with more data, or at least detectable, if you have the right instruments. And here is the point for us: drift and evasion live in the epistemic box. Friday&#x27;s new attack family, the adversary&#x27;s new tooling — those are epistemic events.", "The problem: a single model&#x27;s softmax cannot see its own ignorance, by construction. The softmax reports distance from a boundary the model already has. It has no way to say &quot;my boundary itself might be nonsense here.&quot; For that, you need a second, structurally different opinion."], "bridge": "So how do people actually estimate uncertainty in practice?", "tag": "Part 2 · Concept 2/4", "title": "Uncertainty — what kind of \"don't know\"?", "lines": ["Aleatoric Noise in the world.", "Two flows, identical features, different labels. Irreducible.", "Epistemic Model ignorance.", "Inputs unlike training data. Reducible — if you can detect it."]}, {"n": 20, "kr": "Uncertainty methods", "t": "09:33", "dur": 120, "acts": [], "paras": ["Four families, quickly — this is a menu, not a syllabus. Monte-Carlo dropout: keep dropout on at inference and sample the same network several times; disagreement across samples approximates uncertainty. Cheap to adopt, but the samples share one brain, so they share its blind spots.", "Deep ensembles: train several members independently and let them vote. Boringly simple — and in benchmark after benchmark, still the strongest baseline for uncertainty. The cost is N models.", "Evidential and prior networks: a single forward pass that predicts a distribution over outcomes instead of a point. Elegant, one-pass cheap, but training them well is delicate.", "And the fourth row is our lab: feature-subset experts — a lightweight cousin of deep ensembles where diversity comes from what each member is allowed to see, not just how it was initialized. Forty tiny models, cheaper than one big one at inference.", "The recurring lesson across all four, and it is worth engraving: diversity beats cleverness. Independent views of the data expose ignorance that any single view — however sophisticated — hides from itself."], "bridge": "Which is exactly why our practical proxy is agreement.", "tag": "Part 2 · Concept 2/4", "title": "Estimating uncertainty, in practice", "lines": ["Approach Idea Operational cost", "MC Dropout sample the net with dropout on N forward passes, same model", "Deep ensembles independently trained members N models — strongest baseline", "Evidential / prior nets predict a distribution over outcomes one pass, delicate training"]}, {"n": 21, "kr": "Agreement", "t": "09:35", "dur": 120, "acts": [], "paras": ["So here is the signal we will actually lean on: ensemble agreement. Train K experts on different evidence. For any input, agreement is simply the fraction of experts backing the majority decision. Twenty of forty agree: agreement zero point five — a shrug. Forty of forty: unanimity.", "Why should this track reliability? Because of how the experts fail. On familiar inputs — the kind everyone trained on — the experts converge, each from its own evidence, onto the same answer. On unfamiliar inputs, each expert is ignorant in its own direction, because each one is missing different information. They scatter. And that scatter is measurable without a single label — you are comparing the experts to each other, not to the truth.", "This is also the design idea behind verification-aware IDS research — systems that emit agreement, evidence, and diversity telemetry as first-class outputs, right next to the prediction, rather than as an afterthought bolted on by the monitoring team.", "In our lab: forty experts, and remember, only ten can even see the shortcut. When the shortcut lies, thirty experts never hear the lie. Keep that asymmetry in mind for what comes next."], "bridge": "Agreement is one row of a bigger menu — let me show you the whole menu.", "tag": "Part 2 · Concept 2/4", "title": "A practical proxy: ensemble agreement", "lines": ["Train K experts on different evidence (feature subsets, modalities)", "Agreement = fraction of experts backing the majority decision", "Familiar inputs → experts converge · unfamiliar inputs → experts scatter", "Case in point: verification-aware IDS designs (e.g. VALIDS) emit"]}, {"n": 22, "kr": "Signal menu", "t": "09:37", "dur": 90, "acts": ["레퍼런스 슬라이드 — 사진 시간 잠깐."], "paras": ["Take a photo of this one — it is the reference card for the whole talk. The label-free signal menu. Confidence: free, already there, and — as we are about to prove — capable of lying with a straight face. Agreement: K-times inference with tiny models; catches novelty and evasion. Margin and entropy: free by-products of the output distribution; they read boundary proximity. Evidence-flip: re-run inference with a piece of evidence masked and see if the verdict survives — one extra pass that interrogates what the decision rests on. And the last row, which will star in Demo three: trends of any of these over time. Not the value — the movement.", "The rule of the menu: combine, and never rely on one. Every one of these signals has a failure mode; the failure modes are different; that difference is your safety margin."], "bridge": "One more tool deserves a slide before we cash in — the one with an actual guarantee.", "tag": "Part 2 · reference", "title": "The label-free signal menu", "lines": ["Signal Computed from Extra cost Catches", "Confidence single model output free little, alone — can lie", "Agreement K expert votes K× inference (tiny models) novel inputs, evasion", "Margin / entropy output distribution free boundary proximity"]}, {"n": 23, "kr": "Conformal prediction", "t": "09:38", "dur": 120, "acts": [], "paras": ["Conformal prediction — the fashionable one, and it earns the fashion. The idea: wrap any classifier, no retraining, and instead of one label, output a prediction set. The machinery calibrates a score threshold on held-out data such that the true label lands inside the set at whatever rate you choose — say ninety-five percent. That is a distribution-free, finite-sample guarantee. Real mathematics, not vibes.", "And the behavior is lovely: on easy inputs the set is a single label; on uncertain inputs the set grows — &quot;attack or benign, honestly can&#x27;t tell&quot; — so set size becomes an honest uncertainty dial, per prediction.", "Now the fine print, because a tutorial about trust should model honesty about its own tools. The guarantee assumes exchangeability: tomorrow&#x27;s data statistically looks like the calibration data. Which is precisely the assumption drift destroys. Under shift, the promised ninety-five percent quietly stops being true — the certificate does not expire loudly. So in operations, treat conformal like calibration: use it, love it, and watch set-size trends as a drift signal rather than sleeping on the guarantee."], "bridge": "All right — Demo one should be done. Before we look: place your bet.", "tag": "Part 2 · worth knowing", "title": "Conformal prediction — guarantees, with fine print", "lines": ["Wraps any model; outputs a prediction set , not a single label", "Guarantee: the true label lands in the set with your chosen rate (say 95%)", "Uncertain input ⇒ the set grows — set size is an honest uncertainty signal", "The fine print: the guarantee assumes exchangeability —"]}, {"n": 24, "kr": "버퍼: 베팅", "t": "09:40", "dur": 60, "acts": ["결과 준비됐으면 짧게, 아니면 손들기 충분히."], "paras": ["On our evasive test set, whose mean confidence is higher? Option A — the correct predictions. That is the sane answer; it is what every textbook diagram implies. Option B — the wrong predictions. The perverse answer. Option C — about equal.", "Hands up for A? <em class=\"cue\">(pause)</em> For B? <em class=\"cue\">(pause)</em> For C? <em class=\"cue\">(웃으며)</em> No labels were harmed in this poll — and unlike our models, you are allowed to abstain."], "bridge": "Let’s see who wins.", "tag": "buffer · place your bet", "title": "Before the result lands…", "lines": ["On our evasive test set,", "whose mean confidence is higher?", "A. Correct predictions", "B. Wrong predictions"]}, {"n": 25, "kr": "Checkpoint ②", "t": "09:41", "dur": 180, "acts": ["채워진 표 가리키기. 훅 슬라이드 회수가 핵심. 히스토그램도 잠깐 짚기."], "paras": ["And here is the answer, live from the run you watched me start. Correct predictions: mean confidence zero point nine four five seven. Wrong predictions: zero point nine six three five. <em class=\"cue\">(pause)</em> Zero nine six three five — the exact number from my second slide, reproduced in this room, and the verification line says all checks passed against the pinned reference.", "If you voted B: congratulations, you are already thinking like this tutorial. Confidence here is not merely uninformative — it points backwards. And now you know why, mechanically: the evasive samples suppressed the true indicators and blasted the inverted shortcut, so the baseline sailed far from its learned boundary — on the wrong side. Far from the boundary is confident. Confident and wrong are the same place out there.", "Look at the histograms for a second: the orange mass — the wrong answers — sits above the blue on the confidence axis. There is no threshold you can draw on that picture that keeps the good and dumps the bad. None.", "Now the second row: agreement. Zero point eight eight seven on correct, zero point eight two four on wrong. It separates — in the right direction — because thirty of the forty experts never saw the shortcut, so on evasive samples the lie splits the jury. Same models, same data, two signals: one lies, one testifies."], "bridge": "Confidence lies. The next question is what trusting the right signal actually buys us — in money terms: coverage.", "tag": "Checkpoint ② · 09:28 · Demo 1", "title": "Demo 1 — confidence vs agreement", "lines": ["LIVE", "Signal correct wrong", "Confidence", "Agreement"]}, {"n": 26, "kr": "Kickoff ③", "t": "09:44", "dur": 60, "acts": [], "paras": ["Here is a very operational question. Your SOC wants to auto-block — real automation, no human in the loop. The bar for that is precision one point zero: zero false alarms among what you act on, because one wrongly blocked service pays for a lot of missed detections in political damage.", "The hypothesis for Demo two: a confidence threshold can reach that bar only by throwing away almost everything — a trusted zone the size of a postage stamp. An agreement threshold reaches the same bar while keeping a trusted zone you can actually run a program on. Same models. Only the gatekeeper changes."], "bridge": "Next page — let’s start Demo two.", "tag": "Kickoff ③ · 09:33", "title": "Demo 2 — can we trust some alerts completely?", "lines": ["AGENT KICKOFF", "Hypothesis: to reach a zero-false-alarm (precision 1.0) auto-block policy,", "a confidence threshold must throw away almost everything;", "an agreement threshold keeps far more."]}, {"n": 27, "kr": "Run it — Demo 2", "t": "09:45", "dur": 90, "acts": ["에이전트 경로 시연 (Shift+T → 붙여넣기 → t). 프롬프트의 검증 요구 문구 짚기."], "paras": ["This time, the agent path again — watch the prompt for one detail. <em class=\"cue\">(붙여넣기)</em> It does not say &quot;run demo two.&quot; It says: run it, verify every number against the pinned reference, and report the verdict — and if verification fails, say so, loudly. I never accept an agent&#x27;s &quot;done&quot; without a check I can see. File that sentence away; at the end of the session I will argue it is the same sentence as this entire tutorial. <em class=\"cue\">(엔터, t로 축소)</em>", "While it computes both gates — the concept it is testing."], "bridge": "The concept is called selective prediction — the art of shutting up.", "tag": "Run it · Demo 2", "title": "Three ways to run it — precision-1.0 gate", "lines": ["Manual", "docker compose run --rm lab \\", "python experiments/demo2_selective.py copy", "One-click · presenter"]}, {"n": 28, "kr": "Selective prediction", "t": "09:46", "dur": 120, "acts": [], "paras": ["Selective prediction and abstention: stop treating every prediction equally, and give the model a third output — &quot;not answering this one.&quot;", "The economics are a curve, not a point: as you tighten the acceptance score, coverage falls and precision rises. Answer less, be right more. Every SOC already lives on this curve implicitly — every triage rule, every severity filter is a crude acceptance score. Selective prediction just makes the dial explicit and lets you set it on purpose.", "The scientific question hiding inside is the one Demo two isolates: which score deserves to be the dial? The curve&#x27;s shape depends entirely on whether your acceptance signal actually correlates with being right. Feed it a lying signal and the curve is a cliff; feed it an honest one and it is a plateau.", "And one reframe I want you to take home: an abstained prediction is not a failure. It is a correctly routed decision — to a human, to a sandbox, to a slower pipeline with more context. The failure was pretending you had to answer everything."], "bridge": "And in a SOC, that strictness has a very concrete price tag.", "tag": "Part 2 · Concept 3/4", "title": "Selective prediction & abstention", "lines": ["Stop treating every prediction equally — let the model decline", "Coverage ↔ risk trade-off: answer less, be right more", "The interesting question: which score decides acceptance?", "An abstained prediction is not a failure."]}, {"n": 29, "kr": "버퍼: Precision 1.0", "t": "09:48", "dur": 90, "acts": [], "paras": ["Why the obsession with precision one point zero? Because automation failures are not symmetric. Auto-blocking a false alarm is a self-inflicted outage: you block your own CEO&#x27;s video call once — once — and your automation program is over, no matter how many real attacks it caught. The blast radius of acting is what sets the bar, so the auto-lane gets gated at &quot;we have literally never seen this gate pass a false alarm.&quot;", "Given that bar, the KPI that matters is the size of the trusted zone: what fraction of traffic clears the gate, and how many true detections live inside it. Every additional true positive inside the zone is one incident handled at machine speed — seconds — instead of analyst speed — minutes to hours. That is the number your CISO actually cares about, and it is decided entirely by the quality of your acceptance signal. Demo two prices both signals in exactly those terms."], "bridge": "Demo two should be done — let’s price the trusted zone.", "tag": "Part 2 · buffer", "title": "Why precision 1.0 matters in a SOC", "lines": ["Auto-blocking on false alarms = self-inflicted outage", "So automation is gated on the alerts you can trust completely", "Every extra TP inside the trusted zone = one incident handled at machine speed", "The size of that trusted zone is an operational KPI —"]}, {"n": 30, "kr": "Checkpoint ③", "t": "09:50", "dur": 150, "acts": ["채워진 표. 대비를 천천히."], "paras": ["The trusted zone, measured, verified, on screen. Gate one — confidence. To reach precision one point zero, the threshold has to climb to zero nine eight eight, and at that height, coverage collapses to one point nine percent of traffic. Seventy-six attacks caught in the whole test set. That is not an automation program; that is a rounding error with a dashboard.", "Gate two — agreement. Threshold zero point seven seven five. Coverage: thirty-two percent of all traffic clears the gate with zero false alarms. One thousand two hundred eighty-seven attacks caught. <em class=\"cue\">(pause)</em> Sixteen point nine times more detections, at the identical zero-false-alarm guarantee, from the same models on the same data. We changed one thing: which signal holds the gate.", "Why the gap? You already know: the confident liars. The evasive samples carry sky-high confidence, so the confidence gate must climb above them — throwing away nearly everything honest on the way up. The agreement gate does not have that problem, because the liars cannot get thirty-plus experts to agree. The jury structure filters exactly what the self-report cannot."], "bridge": "Sixteen point nine — in a lab I built. Fair objection. Time for the dataset I did not build.", "tag": "Checkpoint ③ · 09:40 · Demo 2", "title": "Demo 2 — the trusted zone, measured", "lines": ["LIVE", "Method coverage TP", "Confidence ≥ —", "Agreement ≥ —"]}, {"n": 31, "kr": "Lab 2 소개", "t": "09:52", "dur": 150, "acts": [], "paras": ["CIC-IDS2017. Let us be honest with each other: everyone here has touched this dataset, and everyone here has heard the complaints — labeling errors, generation artifacts, the famous port shortcut. All true. And that is exactly why it fits: a tutorial about not blindly trusting your pipeline should not launder its own real-data section through a dataset nobody could audit.", "The structure is a gift for our purposes: five days, two point eight million flows, seventy-seven features. Monday is benign-only. Tuesday and Wednesday carry brute force, DoS, Heartbleed — that is our training era: thirty thousand flows, balanced sampling. Thursday brings web attacks and infiltration, rare and quiet. Friday brings botnet, PortScan, and DDoS at massive scale — attack families our Tuesday-Wednesday models have never seen in any form.", "In other words: the dataset contains a natural drift experiment. Train early-week, walk forward, and watch what happens — no synthetic distortion knob required; the calendar is the adversary. Same baseline, same forty-expert architecture as Lab one, retrained on this data. No tuning safaris, no cherry-picking — the pipeline you can rerun tonight."], "bridge": "And I don’t want you to take that pipeline on faith — next page, we run it.", "tag": "Lab 2 · CIC-IDS2017", "title": "Lab 2 — the dataset you all know", "lines": ["Day Traffic Role here", "Monday benign only —", "Tue + Wed brute force, DoS, Heartbleed training (30k flows)", "Thursday web attacks, infiltration (rare) drift eval"]}, {"n": 32, "kr": "Run it — Lab 2 pipeline", "t": "09:54", "dur": 90, "acts": ["Download 버튼 클릭(캐시 즉시). Preprocess/Train은 사전 완료 상태 언급."], "paras": ["From raw CSVs to trained models: one command, or stage by stage from this page. Download. <em class=\"cue\">(클릭)</em> Instant — because this machine already cached the pinned Kaggle mirror; at home it fetches eight hundred forty-four megabytes exactly once, and the mirror is version-pinned so it cannot silently change underneath you. Preprocessing — two minutes: merge the days, clean the known NaN and infinity artifacts, split by calendar, standardize on training statistics only. Training — five minutes for eighty-two models. I ran both before the session; the content hashes on screen prove it is the same data you would produce.", "Every stage is idempotent — run it twice, it skips what is done. Boring by design. Boring is what reproducible looks like."], "bridge": "Data in, models out. Now the question this whole morning has been building toward.", "tag": "Run it · Lab 2 pipeline", "title": "Dataset → models, live — download · preprocess · train", "lines": ["Manual", "python scripts/run_pipeline.py --track cic copy", "One-click · presenter", "▶ 1 Download idle"]}, {"n": 33, "kr": "Kickoff ④", "t": "09:56", "dur": 60, "acts": [], "paras": ["We trained on Tuesday and Wednesday. Then the week goes on. <em class=\"cue\">(pause)</em>", "The hypothesis for Demo three, and after the last hour it should worry you: on Friday&#x27;s unseen attack families, accuracy will collapse — and neither the confidence mean nor the agreement mean will flag it. Our hero signal from the synthetic lab is about to have a very bad day. Something else will have to raise the alarm — and it is already on the menu slide."], "bridge": "Next page — one click.", "tag": "Kickoff ④ · 09:46", "title": "Demo 3 — then the week goes on", "lines": ["AGENT KICKOFF", "Hypothesis: on Friday's unseen attack families, accuracy collapses —", "and neither confidence nor agreement means will flag it.", "Something else has to."]}, {"n": 34, "kr": "Run it — Demo 3", "t": "09:57", "dur": 60, "acts": ["버튼 클릭. 출력 흐름 잠깐."], "paras": ["Demo three, one click. <em class=\"cue\">(클릭)</em> It evaluates the Tuesday-Wednesday models against three slices — a same-week holdout, Thursday, and Friday — computes accuracy, both per-sample means, and two rate signals, then self-verifies all nineteen numbers against the pinned reference.", "While it walks the week — the last concept pair, and it is the one closest to my own research heart."], "bridge": "Explainability — necessary, and not sufficient.", "tag": "Run it · Demo 3", "title": "Three ways to run it — the week goes on", "lines": ["Manual", "docker compose run --rm lab \\", "python experiments/demo3_cic_drift.py copy", "One-click · presenter"]}, {"n": 35, "kr": "Explainability", "t": "09:58", "dur": 120, "acts": [], "paras": ["Post-hoc explainability — saliency maps, SHAP values, attention heatmaps. Necessary tools, and I use them. But notice what they are: descriptions of a decision after the fact, produced by a second analysis that has its own approximations.", "Two operational problems. First, an explanation can be perfectly plausible and still unverifiable — &quot;the model attended to the payload-length distribution&quot; — fine; is that right? What experiment would tell you? Often none is offered. Second, explanations are consumed by humans as reassurance: a heatmap that highlights something sensible feels like validation, even though sensible-looking heatmaps decorate wrong answers just as happily as right ones.", "Operations needs a harder currency. Here is the line that divides it: &quot;the model looked at these bytes&quot; is a story. &quot;Remove this evidence and the decision flips&quot; is a testable claim — an experiment you can actually run, with a yes-or-no outcome. The entire trick of the next slide is turning explanations from stories into claims."], "bridge": "Here’s how that works — evidence-based verification.", "tag": "Part 2 · Concept 4/4", "title": "Explainability — necessary, not sufficient", "lines": ["Post-hoc XAI (saliency, SHAP, …) describes a decision after the fact", "An explanation can be plausible and still unverifiable", "Operations need explanations you can test , not admire", "\"The model looked at these bytes\" is a story."]}, {"n": 36, "kr": "Evidence-based verification", "t": "10:00", "dur": 120, "acts": [], "paras": ["The recipe has three moves. Move one: find the minimal evidence set — the smallest bundle of features that still carries the decision. Not everything the model glanced at; the load-bearing part.", "Move two: test sufficiency. Feed the model only that evidence, everything else neutralized. Does the verdict reproduce? If yes, the evidence genuinely carries the decision — the rest was scenery.", "Move three: test necessity. Remove the evidence, keep everything else. Does the verdict flip? If yes, nothing else was propping it up — no hidden shortcut standing behind the curtain.", "And a fourth, structural move: keep evidence diverse across the ensemble — different experts leaning on different bodies of evidence — so that no single fragile feature owns the verdict fleet-wide. This is the design direction of verification-aware IDS models: make the model emit its evidence as a first-class output, and then audit the evidence, not the vibes."], "bridge": "Let me make that concrete — one alert, audited.", "tag": "Part 2 · Concept 4/4", "title": "Evidence-based verification", "lines": ["Minimal evidence set : smallest feature subset that carries the decision", "Sufficiency — evidence alone reproduces the decision", "Necessity — removing it flips the decision", "Diverse evidence across experts ⇒ no single shortcut owns the verdict"]}, {"n": 37, "kr": "Evidence in action", "t": "10:02", "dur": 120, "acts": [], "paras": ["One worked example, thirty seconds of imagination. An alert fires: &quot;botnet command-and-control.&quot; The model cites its minimal evidence — three channels: beacon-like regularity in inter-arrival times, a rare TLS fingerprint, and fixed-size uplink bursts.", "Sufficiency test, automatically: keep only those three channels, neutralize everything else — the verdict stays &quot;C2.&quot; Good: the citation is real. Necessity test: remove just the timing channel — the verdict flips to benign. Now we know something sharp: the timing evidence is load-bearing. The fingerprint and the burst sizes were corroboration; the beacon is the case.", "So what does the analyst do? Not &quot;stare at seventy-seven features and a heatmap.&quot; They check that one channel against the pcap: is the beaconing real, or is it an artifact — a polling app, a keep-alive? Minutes, not hours, and the minutes are aimed. The audit interrogates the evidence, not the analyst&#x27;s patience. That is what an explanation looks like when it has been turned into a claim."], "bridge": "And while Demo three finishes — let’s talk about where drift actually comes from.", "tag": "Part 2 · Concept 4/4", "title": "Evidence, in action — one flow, audited", "lines": ["Alert: \"botnet C2\"", "Model cites its minimal evidence: beacon-like inter-arrival regularity +", "rare TLS fingerprint + fixed-size uplink bursts.", "Sufficiency test — keep only those three: verdict stays \"C2\" ✓"]}, {"n": 38, "kr": "버퍼: Drift in the wild", "t": "10:04", "dur": 90, "acts": ["체크포인트 준비됐으면 압축."], "paras": ["Where does drift come from when nobody is attacking you? Everywhere. An application update ships a new TLS library and a thousand fingerprints change overnight. Infrastructure moves — a NAT consolidation, a CDN migration, a proxy rollout — and your flow statistics shift wholesale. Seasonality: exam week on a campus network, quarter-end in a bank. And then the adversarial kind: attackers update tooling precisely because defenders fingerprint the old tooling — drift as a service, aimed at you.", "CIC-IDS2017 compresses all of that into one work week: by Friday, our Tuesday-Wednesday model faces attack families it has never seen in any form. Which is not an exotic stress test — it is a Tuesday-to-Friday story that every production model lives through at some timescale."], "bridge": "So the honest question is not whether drift comes — it’s which of your instruments notice. Here’s the toolbox.", "tag": "buffer · drift in the wild", "title": "Where drift actually comes from", "lines": ["App & TLS library updates change fingerprints overnight", "Infrastructure moves: NAT, CDN, proxy rollouts", "Seasonal and workload cycles", "Attackers updating tooling — the adversarial kind"]}, {"n": 39, "kr": "Drift-detection toolbox", "t": "10:05", "dur": 120, "acts": [], "paras": ["The standing toolbox, all label-free. Input-side: population-stability index and Kolmogorov-Smirnov tests on per-feature distributions — is today&#x27;s traffic shaped like training traffic? Output-side, and criminally underused: prediction-rate monitors — the class mix of what your model is saying. Your model announces &quot;two percent attacks&quot; every day for a month and suddenly says eleven — that needs no labels, no math degree, and it screams. Policy-side: accept-rate monitors — what share of traffic clears your gate. Stream-side: change-point detectors like ADWIN on any score stream. And the slow loop: delayed-label audits — sample a sliver, label it late, catch what the fast loop missed.", "Every row is cheap. Which tells you what the real failure mode is: it is not &quot;no tools.&quot; It is that nobody wired the tools to an alarm anyone reads at three a.m. Demo three, on real data, is about to show you exactly which rows of this table fire — and which expensive-looking signals sleep through the whole thing."], "bridge": "Demo three is done. A real collapse — in real silence.", "tag": "Part 2½ · toolbox", "title": "The drift-detection toolbox", "lines": ["Monitor Watches Labels?", "PSI / KS tests per-feature input distributions no", "Prediction-rate monitors class mix of the model's own outputs no", "Accept-rate monitors share passing your policy threshold no"]}, {"n": 40, "kr": "Checkpoint ④", "t": "10:07", "dur": 180, "acts": ["채워진 표. 행별로 천천히. silent 행에서 목소리 낮추고, rate 행에서 다시 올리기."], "paras": ["Walk the table with me, row by row. Accuracy: zero ninety-six on the same-week holdout. Zero ninety-eight on Thursday — fine, Thursday&#x27;s attacks are rare. Friday: zero sixty-nine. A twenty-eight point collapse in calendar days. And remember the label problem — in production, this row is invisible. So cover it with your hand and look at what you would actually see.", "Mean confidence: zero nine one six, then zero nine one three. Silent. Mean agreement — our synthetic-lab hero: zero ninety-seven to zero ninety-seven. <em class=\"cue\">(조용히)</em> Silent. One thousand two hundred fifty-eight wrong Friday verdicts carry confidence above zero point nine, and on those mistakes the forty experts stay near-unanimous. Understand why, because it is the deepest lesson of the day: Friday&#x27;s attacks are not evasions of known evidence — they are new families. Every expert is ignorant in the same direction, and unanimous ignorance looks exactly like unanimous knowledge. Agreement catches lies about evidence the jury knows. It cannot catch a world the whole jury has never seen.", "Now the rows that moved. <em class=\"cue\">(목소리 올리며)</em> Predicted-attack rate: twenty-two percent on the holdout, eleven on Friday — the model&#x27;s own output mix cut in half, while real attacks nearly doubled. Accept rate at our precision gate: fourteen percent down to eight. Both label-free, both trivially cheap, both screaming that something is structurally wrong — without knowing what. The means are silent; the rates are screaming. Monitor the rates."], "bridge": "So — Monday morning. What do you actually do with all of this?", "tag": "Checkpoint ④ · 09:53 · Demo 3", "title": "Demo 3 — a real collapse, in real silence", "lines": ["LIVE", "Signal holdout friday", "Accuracy (needs labels!)", "Confidence mean"]}, {"n": 41, "kr": "Accept / Review / Withhold", "t": "10:10", "dur": 120, "acts": [], "paras": ["One slide, the whole operational answer. Route every AI output — every one — through a three-way gate.", "Agreement above a high bar, evidence stable: accept — automate. In our lab, zero point seven seven five bought a literal zero-false-alarm record; your number will differ, and you will find it the same way we did — on your own validation traffic, empirically, not by feeling.", "Middle zone: review — analyst triage, which is where explanations-turned-into-claims earn their keep, because they aim the analyst&#x27;s minutes.", "Agreement low, or the signals contradicting each other — confidence up while agreement sags: withhold. Abstain, sandbox, collect, escalate. Remember: withholding is a decision, correctly routed — not a failure.", "If you photograph one slide today, make it this one. And tune the thresholds on your traffic. Mine are a demonstration, not a gift."], "bridge": "Same gate, seen as a diagnostic map.", "tag": "Part 4 · Operations", "title": "Accept / Review / Withhold", "lines": ["Condition (example policy) Route", "Agreement ≥ high bar (our lab: 0.775 ⇒ precision 1.0)", "Accept — automate", "Agreement mid-range, evidence stable"]}, {"n": 42, "kr": "Signal → action map", "t": "10:12", "dur": 90, "acts": [], "paras": ["Four patterns to memorize as reflexes. Confidence high, agreement low: suspect shortcut or evasion — the self-report and the jury disagree; trust the jury, review it. Agreement high and stable across the fleet: your trusted zone — automate inside it, and let the record justify widening it. Agreement trending down fleet-wide over days: drift onset — schedule recalibration and refresh before accuracy quietly leaves. And the fourth pattern, the one you have now seen with your own eyes on real data: confidence rising while accuracy falls — the lying pattern. When the self-report improves while the world degrades, freeze the automation and investigate. That combination is never good news."], "bridge": "Now — a plot twist that isn’t one: the newest AI in your SOC doesn’t even have a softmax.", "tag": "Part 4 · Operations", "title": "Signal → action map", "lines": ["Observation Interpretation Action", "Confidence high, agreement low Likely shortcut / evasion Distrust confidence; review", "Agreement high & stable Trusted zone Automate (block/close)", "Agreement trending down fleet-wide Drift onset Trigger recalibration / retraining"]}, {"n": 43, "kr": "LLM in the SOC", "t": "10:13", "dur": 120, "acts": [], "paras": ["Because the newest tenant in the SOC is an LLM. Triage summaries, alert enrichment, log explanation, query drafting — this is already in production across the industry, including, statistically speaking, several of your organizations.", "Same disease, new symptoms. An LLM&#x27;s output arrives as fluent, confident-sounding prose — with no probability attached at all. There is no softmax to distrust; there is tone. And tone is a trained artifact squared: these systems are optimized to sound helpful. When people ask the model to verbalize its confidence — &quot;how sure are you?&quot; — the studies keep finding that verbalized certainty is less calibrated than softmax ever was. Fluent and wrong is the LLM&#x27;s native failure mode, and it is the overconfidence trap wearing better clothes.", "The transfer of today&#x27;s principles is direct: do not grade the tone — demand the evidence. A triage summary should cite the log lines it read, the rule ID that fired, the query it actually ran — artifacts you can check with a click, sufficiency-and-necessity style. An uncited claim from an LLM is a story. You know what we do with stories now."], "bridge": "And once the LLM starts doing things — not just saying things — the stakes go up again.", "tag": "Part 4 · the new tenant", "title": "When the AI in your SOC is an LLM", "lines": ["Triage summaries, alert enrichment, query drafting — already in production", "Same disease, new symptoms: fluent, confident-sounding text with no", "probability attached at all", "Verbalized confidence (\"I am quite sure\") is less calibrated than softmax ever was"]}, {"n": 44, "kr": "Trusting agents", "t": "10:15", "dur": 120, "acts": [], "paras": ["Agents — AI that runs commands, edits configs, executes playbooks. Here the outputs are actions, and everything from today translates line by line; the slide shows the dictionary. Verify against a pinned reference becomes: every delegated task ships with its own check — exactly how every prompt in this tutorial was written, and you watched the agent report pass-fail lines all morning. Agreement across experts becomes: for high-stakes actions, an independent cross-check — a second agent, a different tool, a dry run — before commit. Accept-review-withhold becomes autonomy tiers: suggest first, gated execution next, full automation last — each tier earned by a verified track record, not by a demo that went well once. And watch rates, not means becomes: monitor task-failure and human-correction rates over time; when corrections trend up, the world moved.", "You have watched me run this exact loop since nine o&#x27;clock: delegate, verify, then trust — in that order, every time. Trust, in this framing, is not a feeling you have about a system. It is a workflow you run around one."], "bridge": "Speaking of which — homework.", "tag": "Part 4 · the new tenant", "title": "Trusting (the work of) agents", "lines": ["Today's rule Agent-world translation", "Verify against a pinned reference every agent task ships its own check — like our prompts did", "Agreement across experts independent agent (or tool) cross-checks on high-stakes output", "Accept / review / withhold autonomy tiers: suggest → gated action → auto, by verified track record"]}, {"n": 45, "kr": "Take-home prompt: policy tuning", "t": "10:17", "dur": 60, "acts": [], "paras": ["This one is homework, not live. The prompt on this page hands an agent a complete assignment: sweep agreement thresholds on our lab, build your own accept-review-withhold table at three target precisions, and — of course — sanity-check itself against the pinned reference before reporting. It refuses to touch the frozen spec. Run it tonight on our lab to see the shape; then rebuild it on your traffic, where the thresholds actually mean something."], "bridge": "The checklist version of everything, then.", "tag": "Part 4 · hands-on", "title": "Tune the gate on your own numbers", "lines": ["TAKE-HOME PROMPT", "[프롬프트]", "prompts/04_policy_tuning.md · not run live — this is your homework, on your traffic."]}, {"n": 46, "kr": "Deployment checklist", "t": "10:18", "dur": 90, "acts": [], "paras": ["Five boxes before your next model ships. Measure calibration on held-out data — assume it is broken until shown otherwise, then fix it with the thirty-second trick and re-measure on schedule, because it decays. Design the abstention path before turning on automation — where does a withheld decision physically go, and who owns it? Emit label-free telemetry from day one — agreement, evidence stability, and the rates; day one, because you need the quiet baseline before the loud week. Watch trends, not values — a healthy number is a number that is not moving. And pin everything — environment, data, models, expected outputs — like we did today; it is the difference between &quot;works on my machine&quot; and &quot;verified in your machine.&quot;"], "bridge": "And to keep us honest — what today did not prove.", "tag": "Part 4 · Operations", "title": "Deployment checklist", "lines": ["☐ Measure calibration on held-out data — assume it is broken until shown otherwise", "☐ Design the abstention path before turning on automation", "☐ Emit label-free telemetry (agreement, evidence stability) from day one", "☐ Watch signal trends , not single values"]}, {"n": 47, "kr": "Honest limits", "t": "10:19", "dur": 120, "acts": [], "paras": ["Five limits, stated plainly. Lab one is synthetic by design — it demonstrates failure mechanisms with surgical clarity, but it measures no real-world rate; do not quote sixteen-point-nine as a law of nature. Agreement is not a silver bullet — you watched Friday fool all forty experts at once, on real data; unanimous ignorance is its blind spot, and I showed it to you on purpose. Lab two is one dataset, one week, with known flaws — thresholds and rates do not transfer; recalibrate on your traffic. Generic ensembles are not verification-aware models — evidence-level telemetry, built into the model rather than bolted on, is the research direction this tutorial argues for. And agent-driven runs add their own variance — which is exactly why every run today carried its own verification, and why yours should too."], "bridge": "With the limits stated — the whole story, on one screen.", "tag": "Part 4 · Honest limits", "title": "What today's lab does not prove", "lines": ["Lab 1 is synthetic by design — it demonstrates failure mechanisms, not real-world rates", "Agreement is not a silver bullet — you watched Friday's novel attacks fool", "all 40 experts at once , live, on real data", "Lab 2 is one dataset, one week — thresholds and rates do not transfer; recalibrate on your traffic"]}, {"n": 48, "kr": "Wrap-up: 대시보드", "t": "10:21", "dur": 360, "acts": ["D 키 → 대시보드 탭. 아래 낭독. 시간 부족 시 타일 4개만."], "paras": ["<em class=\"cue\">(D키)</em> This is the live dashboard — it has been quietly collecting everything we ran. The four tiles are the whole morning in four numbers. Plus zero point zero one seven eight: confidence separating in the wrong direction. Sixteen point nine times: what the right gatekeeper buys at zero false alarms. Zero ninety-six to zero sixty-nine: Friday&#x27;s collapse, which the means slept through. Twelve fifty-eight: confidently wrong verdicts in one afternoon of drift.", "<em class=\"cue\">(카드 훑으며)</em> Demo one — the orange wrong-answer mass above the blue on the confidence axis; the picture version of &quot;more confident when wrong.&quot; Demo two — the same bar, seventeen times taller. Demo three — three flat lines over one collapsing line, and beside it, the two rate signals that actually moved.", "Every number here was verified against a pinned reference at plus or minus five thousandths — and this exact page is public. The QR on the final slide takes you to the repository; the audit view of this dashboard is one click from there, backed by the pinned reference numbers, and one command rebuilds every bit of it on your laptop."], "bridge": "Back to the slides — because the best way to trust this lab is to try to break it.", "tag": "Wrap-up ① · 10:08", "title": "The whole story, on one screen", "lines": ["LIVE", "→ switching to http://localhost:8000/dashboard/", "Three demos, every number verified against the pinned reference,", "all reproduced in this room within the last hour."]}, {"n": 49, "kr": "탐구 프롬프트", "t": "10:24", "dur": 60, "acts": [], "paras": ["Three ready-made ways to break our lab, and I sincerely hope you try. Stress it: regenerate the test sets with harsher evasion and find the point where agreement finally gives up — it exists. Sabotage the ensemble: add experts that all see the shortcut and watch the agreement signal rot — diversity is doing real work, and you can measure exactly how much. Or bring your own model: score its confidence on our evasive subset and see whether your favorite architecture is also more confident when wrong. Agent prompts for all three are in the repo, and each one verifies itself, naturally."], "bridge": "Which brings us to the three lines I want you to keep.", "tag": "Wrap-up · keep playing", "title": "Three ways to break the lab (please do)", "lines": ["TAKE-HOME PROMPTS", "Stress it — regenerate test sets with harsher evasion via datagen parameters", "Sabotage the ensemble — add experts that all see the shortcut; watch agreement degrade", "Bring your own model — score its confidence on our evasive subset"]}, {"n": 50, "kr": "Take-home", "t": "10:25", "dur": 120, "acts": ["마지막 문단은 반드시 청중 보고. QR 잠시 유지. 인사."], "paras": ["Three lines. One: accuracy is not reliability — the best metric you have is the one you cannot see in production, so stop steering by it alone. Two: verify with multiple label-free signals — agreement, evidence, and above everything, trends; every signal lies somewhere, so make them lie differently. Three: never treat predictions equally — accept, review, withhold; the gate is the product.", "And one last thought. <em class=\"cue\">(pause)</em> Since nine o&#x27;clock you have watched me hand work to an AI agent, wait, and then verify its output against a pinned reference before believing a word of it. Delegate — verify — then trust. <em class=\"cue\">(pause)</em> That loop is not a presentation gimmick. It is exactly how your SOC should treat every AI prediction it receives, from a softmax or from a language model, today and five years from now. The systems will keep changing. The loop is the part you get to keep.", "Everything is yours: the artifact, the prompts, the pinned numbers — scan the QR. I would genuinely love to hear what you break. I will be right here after the session for questions. Thank you very much. <em class=\"cue\">(인사)</em>", "---"], "bridge": null, "tag": "Wrap-up ②", "title": "Take-home", "lines": ["Accuracy ≠ Reliability — the best metric is the one you cannot see in production", "Verify with multiple label-free signals — agreement, evidence, trends", "Never treat predictions equally — accept / review / withhold", "The way I treated my agent today — delegate, then verify the output —"]}];
